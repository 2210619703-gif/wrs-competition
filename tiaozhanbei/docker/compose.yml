# 在仓库根目录：
#   set DATASET_LEARN=F:\你的路径\dataset_learn
#   docker compose -f tiaozhanbei/docker/compose.yml up --build
#
# DATASET_LEARN 必须是解压后的 dataset_learn 目录（里面直接是 0001、0501、0502 …）

services:
  tiaozhanbei:
    image: tiaozhanbei-sim:latest
    build:
      context: ../..
      dockerfile: tiaozhanbei/docker/Dockerfile
    working_dir: /app
    environment:
      PYTHONPATH: /app
      PYTHONUTF8: "1"
    volumes:
      - ${DATASET_LEARN}:/app/tiaozhanbei/dataset_learn:ro
    command:
      - python
      - tiaozhanbei/sim/run_agent_pick_place_side_sim.py
      - --dataset-root
      - /app/tiaozhanbei/dataset_learn
      - --sample-id
      - "0501"
      - --no-anime
