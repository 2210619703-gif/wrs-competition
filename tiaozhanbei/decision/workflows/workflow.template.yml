    - data:
        code: "import re\nimport json\n\ndef repair_broken_json(text: str) -> str:\n\
          \    \"\"\"简易修复残缺JSON：补收尾括号、剔除末尾多余文字\"\"\"\n    text = text.strip()\n  \
          \  # 只保留第一个 { 到匹配闭合 } 的内容\n    start = text.find(\"{\")\n    if start ==\
          \ -1:\n        return \"\"\n    balance = 0\n    cut_pos = None\n    for\
          \ idx, char in enumerate(text[start:]):\n        if char == \"{\":\n   \
          \         balance += 1\n        elif char == \"}\":\n            balance\
          \ -= 1\n            if balance == 0:\n                cut_pos = start +\
          \ idx + 1\n                break\n    if cut_pos:\n        text = text[:cut_pos]\n\
          \    return text\n\ndef extract_json_text(text: str) -> str:\n    if not\
          \ text:\n        return \"\"\n    text = text.strip()\n    # 清除推理标签\n  \
          \  text = re.sub(r\"<\\|think\\|>.*?</\\|think\\|>\", \"\", text, flags=re.DOTALL)\n\
          \    text = re.sub(r\"<think.*?>.*?\", \"\", text, flags=re.DOTALL)\n  \
          \  # 剥离```代码标记\n    block = re.search(r\"```(?:json)?\\s*(\\{[\\s\\S]*?\\\
          })\\s*```\", text)\n    if block:\n        raw = block.group(1).strip()\n\
          \        return repair_broken_json(raw)\n    pure_json = re.search(r\"\\\
          {.*\\}\", text, flags=re.DOTALL)\n    if pure_json:\n        raw = pure_json.group(0).strip()\n\
          \        return repair_broken_json(raw)\n    return \"\"\n\ndef default_error_task(reason:\
          \ str) -> dict:\n    return {\n        \"task_id\": \"error\",\n       \
          \ \"action\": \"idle\",\n        \"object\": \"\",\n        \"coordinate\"\
          : [0.0, 0.0, 0.0],\n        \"dest_coordinate\": [0.0, 0.0, 0.0],\n    \
          \    \"destination\": \"\",\n        \"angle\": 0.0,\n        \"rpy\": [0.0,\
          \ 0.0, 0.0],\n        \"retry\": 0,\n        \"max_retry\": 3,\n       \
          \ \"status\": \"error\",\n        \"reason\": reason,\n    }\n\ndef is_valid_desk_coord(coord)\
          \ -> bool:\n    if not isinstance(coord, list) or len(coord) != 3:\n   \
          \     return False\n    if not all(isinstance(v, (int, float)) for v in\
          \ coord):\n        return False\n    x, y, z = coord\n    if max(abs(x),\
          \ abs(y), abs(z)) > 5.0:\n        return False\n    return abs(x) <= 2.0\
          \ and abs(y) <= 2.0 and abs(z) <= 1.0\n\ndef find_max_pixel_obj(parts_3d):\n\
          \    if not parts_3d:\n        return None\n    return max(parts_3d, key=lambda\
          \ p: p[\"visible_pixels\"])\n\ndef find_object(parts_3d, object_name: str):\n\
          \    for p in parts_3d:\n        if p.get(\"class\") == object_name:\n \
          \           return p\n    return None\n\ndef main(llm_raw, parts_3d=None,\
          \ target_xyz=None):\n    if isinstance(llm_raw, dict) and \"text\" in llm_raw:\n\
          \        llm_raw = llm_raw[\"text\"]\n    if llm_raw is None or not isinstance(llm_raw,\
          \ str):\n        llm_raw = \"\"\n\n    parts_3d = parts_3d or []\n    target_xyz\
          \ = target_xyz or [0.0, 0.0]\n    required_fields = [\"task_id\", \"action\"\
          , \"object\", \"destination\", \"retry\", \"max_retry\", \"status\", \"\
          reason\"]\n    allowed_actions = {\"pick\", \"move\", \"place\", \"idle\"\
          }\n    valid = False\n    parsed_json = {}\n    error_msg = \"\"\n\n   \
          \ try:\n        json_str = extract_json_text(llm_raw.strip())\n        if\
          \ not json_str:\n            raise ValueError(\"json format error:无json内容\"\
          )\n        parsed_json = json.loads(json_str)\n        if not isinstance(parsed_json,\
          \ dict):\n            raise ValueError(\"json format error:非对象\")\n    \
          \    # 自动补齐所有缺失字段，不再因为少key直接报错\n        fill_map = {\n            \"retry\"\
          : 0,\n            \"max_retry\": 3,\n            \"task_id\": \"t001\",\n\
          \            \"status\": \"invalid\",\n            \"action\": \"pick\"\
          ,\n            \"object\": \"\",\n            \"destination\": \"\",\n \
          \           \"reason\": \"\"\n        }\n        for key, default_val in\
          \ fill_map.items():\n            if key not in parsed_json:\n          \
          \      parsed_json[key] = default_val\n\n        action = str(parsed_json.get(\"\
          action\", \"\")).strip()\n        status_raw = str(parsed_json.get(\"status\"\
          , \"\")).strip()\n        object_name = str(parsed_json.get(\"object\",\
          \ \"\")).strip()\n\n        # 非法动作自动兜底\n        if action not in allowed_actions:\n\
          \            parsed_json[\"action\"] = \"pick\"\n            action = \"\
          pick\"\n\n        if action in (\"pick\", \"move\", \"place\"):\n      \
          \      target_obj = find_object(parts_3d, object_name)\n            if target_obj\
          \ is None and len(parts_3d) > 0:\n                target_obj = find_max_pixel_obj(parts_3d)\n\
          \                parsed_json[\"object\"] = target_obj[\"class\"]\n     \
          \           parsed_json[\"status\"] = \"invalid\"\n                parsed_json[\"\
          reason\"] = f\"指令未明确指定零件，已匹配最大可见零件{target_obj['class']}\"\n            if\
          \ target_obj is None:\n                raise ValueError(\"未找到目标物体\")\n\n\
          \            parsed_json[\"coordinate\"] = list(target_obj[\"xyz\"])\n \
          \           parsed_json[\"dest_coordinate\"] = list(target_xyz)\n      \
          \      parsed_json[\"angle\"] = float(target_obj[\"rpy\"][2])\n        \
          \    parsed_json[\"rpy\"] = list(target_obj[\"rpy\"])\n\n            if\
          \ not is_valid_desk_coord(parsed_json[\"coordinate\"]):\n              \
          \  raise ValueError(f\"物体坐标异常:{parsed_json['coordinate']}\")\n         \
          \   if action in (\"move\", \"place\") and not is_valid_desk_coord(parsed_json[\"\
          dest_coordinate\"]):\n                raise ValueError(f\"目标坐标异常:{parsed_json['dest_coordinate']}\"\
          )\n\n            if status_raw == \"valid\":\n                valid = True\n\
          \            elif status_raw == \"invalid\" and \"已匹配最大可见零件\" in parsed_json.get(\"\
          reason\", \"\"):\n                valid = True\n            else:\n    \
          \            valid = False\n        else:\n            parsed_json[\"coordinate\"\
          ] = [0.0, 0.0, 0.0]\n            parsed_json[\"dest_coordinate\"] = [0.0,\
          \ 0.0, 0.0]\n            parsed_json[\"angle\"] = 0.0\n            parsed_json[\"\
          rpy\"] = [0.0, 0.0, 0.0]\n            valid = (status_raw == \"valid\")\n\
          \    except json.JSONDecodeError:\n        error_msg = \"json format error\"\
          \n        parsed_json = default_error_task(error_msg)\n        valid = False\n\
          \    except Exception as e:\n        error_msg = str(e)\n        parsed_json\
          \ = default_error_task(error_msg)\n        valid = False\n\n    return {\n\
          \        \"result\": {\n            \"valid\": valid,\n            \"task_json\"\
          : parsed_json,\n            \"error\": error_msg,\n        }\n    }"
