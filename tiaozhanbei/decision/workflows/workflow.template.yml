    - data:
        code: "def main(task_data: dict, error_msg: str, user_cmd: str) -> dict:\n\
          \    if not isinstance(task_data, dict):\n        task_data = {}\n\n   \
          \ raw_status = task_data.get(\"status\", \"\")\n    raw_reason = task_data.get(\"\
          reason\", \"\")\n    # 宽泛匹配自动选取零件文案，适配所有输出描述\n    auto_key_words = [\"匹配最大可见\"\
          , \"自动选择\", \"未明确指定零件\", \"选取\", \"默认选择\"]\n    auto_pick_ok = raw_status\
          \ == \"invalid\" and any(word in raw_reason for word in auto_key_words)\n\
          \    # 判断：真正异常场景\n    real_error = error_msg != \"\" or raw_status == \"\
          error\" or \"json format error\" in raw_reason\n\n    if auto_pick_ok:\n\
          \        # 正常抓取任务，三维坐标\n        out = {\n            \"pick_task\": {\n\
          \                \"task_id\": task_data.get(\"task_id\", \"t001\"),\n  \
          \              \"action\": \"pick\",\n                \"object\": task_data.get(\"\
          object\", \"\"),\n                \"coordinate\": task_data.get(\"coordinate\"\
          , [0.0, 0.0, 0.0]),\n                \"destination\": task_data.get(\"destination\"\
          , \"\"),\n                \"angle\": round(float(task_data.get(\"angle\"\
          , 0.0)), 6),\n                \"retry\": task_data.get(\"retry\", 0),\n\
