          ,\n        \"选取\"\n    ]\n    is_auto_capture = raw_status == \"invalid\"\
          \ and any(word in raw_reason for word in auto_keywords)\n    if is_auto_capture:\n\
          \        new_task[\"status\"] = \"pending\"\n        new_task[\"action\"\
          ] = \"pick\"\n\n    return {\n        \"valid_flag\": bool(result_dict.get(\"\
          valid\", False)),\n        \"task_data\": new_task,\n        \"error_msg\"\
