# YOLOv8 + RealSense 点云实时检测环境
# 创建: conda env create -f environment-yolov8.yml
# 激活: conda activate yolov8

name: yolov8
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.23
  - opencv>=4.8
  - pip:
      - ultralytics>=8.0.0
      - open3d>=0.17.0
      - pyrealsense2>=2.54.0
      - torch>=2.0.0
      - torchvision>=0.15.0
